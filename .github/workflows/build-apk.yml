name: Build Test APK
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android platform 35
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Preinstalled platforms:"; ls "$ANDROID_HOME/platforms" || true
          echo "Preinstalled build-tools:"; ls "$ANDROID_HOME/build-tools" || true
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          timeout 180 "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" < /dev/null || echo "sdkmanager timed out or failed - continuing; Gradle will fetch the platform or fail with the real error"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install dependencies
        run: npm ci
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Publish APK chunks to build-output branch
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk-out
          sha256sum "$APK" | awk '{print $1}' > apk-out/SHA256.txt
          stat -c '%s' "$APK" > apk-out/SIZE.txt
          split -b 900000 "$APK" apk-out/chunk-
          ls -la apk-out
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -B build-output
          git add apk-out
          git commit -m "Test APK build output"
          git push -f origin build-output
